<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sergio González · Portfolio</title>
  <meta name="description" content="Sergio González Castilla · portfolio: profile, projects, skills and contact." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fondo animado (ondas) -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Menú principal -->
  <main id="xmb" aria-label="Main menu">
    <svg id="halo" aria-hidden="true"></svg>
    <div id="cats" role="tablist"></div>
    <div id="cols"></div>
  </main>

  <!-- Panel de detalle -->
  <aside id="panel" aria-hidden="true" aria-live="polite">
    <button class="panel-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="panel-scroll"><div class="panel-content"></div></div>
  </aside>

  <!-- Marca -->
  <button id="brand" type="button">
    <span class="brand-name">Sergio González Castilla</span>
    <span class="brand-sub">Portfolio</span>
  </button>

  <!-- HUD: fecha/hora + sonido -->
  <header id="hud">
    <button id="mute" type="button" aria-label="Sound"></button>
    <div id="clock"><span id="clock-date">--/--</span><span id="clock-time">--:--</span></div>
  </header>

  <!-- Pistas de controles -->
  <footer id="hints">
    <span class="h-key"><kbd>◀</kbd><kbd>▶</kbd> <span data-i18n="hCat">Category</span></span>
    <span class="h-key"><kbd>▲</kbd><kbd>▼</kbd> <span data-i18n="hSel">Select</span></span>
    <span class="h-key"><kbd>Enter</kbd> <span data-i18n="hOpen">Open</span></span>
    <span class="h-key"><kbd>Esc</kbd> <span data-i18n="hBack">Back</span></span>
    <span class="h-touch" data-i18n="hTouch">Swipe to navigate · Tap to open</span>
  </footer>

  <!-- Secuencia de arranque -->
  <div id="boot">
    <button class="boot-start" type="button">
      <span class="start-ring"></span>
      <span class="start-text" data-i18n="start">Press any key to start</span>
    </button>
    <div class="boot-stage" aria-hidden="true">
      <div class="boot-flash"></div>
      <div class="boot-streak"></div>
      <div class="boot-particles"></div>
      <div class="boot-logo">
        <svg class="sgc-logo" viewBox="0 0 334 120">
          <defs>
            <linearGradient id="sgc-metal" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="107">
              <stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#e4e9ef"/>
              <stop offset=".52" stop-color="#b4bec9"/><stop offset="1" stop-color="#f2f5f8"/>
            </linearGradient>
            <linearGradient id="sgc-shine" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="-30" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              <animateTransform id="sgc-shine-anim" attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="0.9s" begin="indefinite" fill="freeze"/>
            </linearGradient>
          </defs>
          <g class="sgc-letters" fill="none" stroke="url(#sgc-metal)" stroke-width="13" stroke-linejoin="round">
          <path pathLength="1" d="M90 20H40a20 20 0 0 0 0 40h30a20 20 0 0 1 0 40H12"/>
          <path pathLength="1" d="M212 20h-52a40 40 0 0 0 0 80h52V62h-30"/>
          <path pathLength="1" d="M322 20h-42a40 40 0 0 0 0 80h42"/>
          </g>
          <g fill="none" stroke="url(#sgc-shine)" stroke-width="13" stroke-linejoin="round">
          <path d="M90 20H40a20 20 0 0 0 0 40h30a20 20 0 0 1 0 40H12"/>
          <path d="M212 20h-52a40 40 0 0 0 0 80h52V62h-30"/>
          <path d="M322 20h-42a40 40 0 0 0 0 80h42"/>
          </g>
        </svg>
        <div class="sgc-sub">Sergio González Castilla</div>
      </div>
    </div>
    <span class="boot-skip" data-i18n="skip">Press to skip</span>
  </div>

  <noscript><p class="noscript">This site needs JavaScript to work.</p></noscript>

  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="waves.js"></script>
  <script src="cursor.js"></script>
  <script src="script.js"></script>
</body>
</html>
